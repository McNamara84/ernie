codecov:
  require_ci_to_pass: true
  notify:
    after_n_builds: 2
    wait_for_ci: true

coverage:
  precision: 5
  round: down
  status:
    project:
      default:
        # Fixed baseline: 84482 / 95483 lines at f05d239567f427155b1df4e75bdf0f74b8f27261.
        # Keep the project gate aggregated; individual areas may exchange coverage.
        target: 88.47857733%
        threshold: 0%
        informational: false
        if_not_found: failure
    patch:
      default:
        informational: true

ignore:
  # Third-party UI library (shadcn/ui) — not our code
  - "resources/js/components/ui/**"
  # Auto-generated Wayfinder route helpers
  - "resources/js/actions/**"
  - "resources/js/routes/**"
  - "resources/js/routes.ts"
  # Application entry points (not unit-testable)
  - "resources/js/app.tsx"
  - "resources/js/ssr.tsx"
  - "resources/js/swagger.tsx"
  # Pure type definition files (no executable code)
  - "resources/js/**/*.d.ts"
  - "resources/js/types/affiliations.ts"
  - "resources/js/types/docs.ts"
  - "resources/js/types/portal.ts"
  - "resources/js/types/resources.ts"
  # Schema migrations are exercised by tests but not treated as line-coverage targets
  - "database/migrations/**"
  # Legacy migration backups
  - "database/migrations_backup/**"
  # Framework boilerplate
  - "bootstrap/**"

flags:
  backend:
    paths:
      - app/
      - routes/
      - config/
      - database/
    carryforward: false
  frontend:
    paths:
      - resources/js/
    carryforward: false

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
