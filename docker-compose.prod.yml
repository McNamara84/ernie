services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    pull_policy: build
    container_name: dockerized-laravel-app
    restart: unless-stopped
    volumes:
      - storage-data:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
    networks:
      - dockerized-laravel-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9000"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    environment:
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-https://dataservices.gfz.de}
      # OAI-PMH identifiers are persistent and must not change with APP_URL.
      - OAI_IDENTIFIER_PREFIX=${OAI_IDENTIFIER_PREFIX:-oai:ernie.rz-vm499.gfz.de}
      - APP_ENV=production
      - APP_DEBUG=false
      - INERTIA_SSR_ENABLED=false
      - ERNIE_API_KEY=${ERNIE_API_KEY}
      - DATACITE_ENDPOINT=${DATACITE_ENDPOINT:-https://api.datacite.org}
      - DATACITE_CLIENT_ID=${DATACITE_CLIENT_ID:-tib.gfz}
      - DATACITE_TEST_MODE=${DATACITE_TEST_MODE:-true}
      - DATACITE_USERNAME=${DATACITE_USERNAME}
      - DATACITE_PASSWORD=${DATACITE_PASSWORD}
      - DATACITE_IGSN_PREFIX=${DATACITE_IGSN_PREFIX:-10.60510}
      - DATACITE_IGSN_CLIENT_ID=${DATACITE_IGSN_CLIENT_ID:-gfz.igsn}
      - DATACITE_IGSN_USERNAME=${DATACITE_IGSN_USERNAME}
      - DATACITE_IGSN_PASSWORD=${DATACITE_IGSN_PASSWORD}
      - DATACITE_USER_AGENT_EMAIL=${DATACITE_USER_AGENT_EMAIL:-datapub@gfz.de}
      - DATACITE_QUEUE=${DATACITE_QUEUE:-datacite}
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - SESSION_PATH=/
      - SESSION_DOMAIN=dataservices.gfz.de
      - SESSION_SECURE_COOKIE=true
      - SESSION_SAME_SITE=lax
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - BROADCAST_DRIVER=log
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=database
      - BOT_PROTECTION_ENABLED=${BOT_PROTECTION_ENABLED:-true}
      - BOT_PROTECTION_AI_USER_AGENTS=${BOT_PROTECTION_AI_USER_AGENTS:-Amazonbot,anthropic-ai,Applebot-Extended,Bytespider,CCBot,ChatGPT-User,ClaudeBot,Claude-User,cohere-ai,Diffbot,FacebookBot,Google-Extended,GPTBot,ImagesiftBot,Meta-ExternalAgent,omgili,PerplexityBot,YouBot}
      - BOT_PROTECTION_AI_BOT_PUBLIC_PER_MINUTE=${BOT_PROTECTION_AI_BOT_PUBLIC_PER_MINUTE:-6}
      - BOT_PROTECTION_PUBLIC_LANDING_PER_MINUTE=${BOT_PROTECTION_PUBLIC_LANDING_PER_MINUTE:-60}
      - BOT_PROTECTION_PUBLIC_LANDING_JSONLD_PER_MINUTE=${BOT_PROTECTION_PUBLIC_LANDING_JSONLD_PER_MINUTE:-30}
      - BOT_PROTECTION_PUBLIC_PORTAL_PER_MINUTE=${BOT_PROTECTION_PUBLIC_PORTAL_PER_MINUTE:-20}
      - BOT_PROTECTION_PUBLIC_PORTAL_MAP_PER_MINUTE=${BOT_PROTECTION_PUBLIC_PORTAL_MAP_PER_MINUTE:-120}
      - BOT_PROTECTION_LANDING_CACHE_TTL=${BOT_PROTECTION_LANDING_CACHE_TTL:-600}
      - BOT_PROTECTION_PORTAL_CACHE_TTL=${BOT_PROTECTION_PORTAL_CACHE_TTL:-120}
      - PORTAL_MAP_ENABLED=${PORTAL_MAP_ENABLED:-true}
      - PORTAL_MAP_MAX_FEATURES=${PORTAL_MAP_MAX_FEATURES:-1000}
      - PORTAL_MAP_CLUSTER_RADIUS=${PORTAL_MAP_CLUSTER_RADIUS:-60}
      - PORTAL_MAP_SHAPE_DETAIL_ZOOM=${PORTAL_MAP_SHAPE_DETAIL_ZOOM:-10}
      - PORTAL_MAP_CACHE_TTL=${PORTAL_MAP_CACHE_TTL:-30}
      - PORTAL_MAP_EXTENT_CACHE_TTL=${PORTAL_MAP_EXTENT_CACHE_TTL:-300}
      - BOT_PROTECTION_VIEW_COUNT_DEBOUNCE_SECONDS=${BOT_PROTECTION_VIEW_COUNT_DEBOUNCE_SECONDS:-3600}
      - FUJI_ENABLED=${FUJI_ENABLED:-false}
      - FUJI_BASE_URL=${FUJI_BASE_URL:-http://fuji:1071}
      - FUJI_USERNAME=${FUJI_USERNAME:-ernie}
      - FUJI_PASSWORD=${FUJI_PASSWORD}
      - FUJI_TIMEOUT=${FUJI_TIMEOUT:-120}
      - FUJI_CONNECT_TIMEOUT=${FUJI_CONNECT_TIMEOUT:-10}
      - FUJI_USE_DATACITE=${FUJI_USE_DATACITE:-true}
      - FUJI_USE_GITHUB=${FUJI_USE_GITHUB:-false}
      - FUJI_TEST_DEBUG=${FUJI_TEST_DEBUG:-false}
      - FUJI_METRIC_VERSION=${FUJI_METRIC_VERSION:-metrics_v0.8}
      - SANCTUM_STATEFUL_DOMAINS=dataservices.gfz.de
      - DB_SUMARIOPMD_HOST=${DB_SUMARIOPMD_HOST:-127.0.0.1}
      - DB_SUMARIOPMD_PORT=${DB_SUMARIOPMD_PORT:-3306}
      - DB_SUMARIOPMD_NAME=${DB_SUMARIOPMD_NAME:-sumario-pmd}
      - DB_SUMARIOPMD_USER=${DB_SUMARIOPMD_USER:-root}
      - DB_SUMARIOPMD_PASSWORD=${DB_SUMARIOPMD_PASSWORD:-}
      - DB_METAWORKS_HOST=${DB_METAWORKS_HOST:-127.0.0.1}
      - DB_METAWORKS_PORT=${DB_METAWORKS_PORT:-3306}
      - DB_METAWORKS_NAME=${DB_METAWORKS_NAME:-metaworks}
      - DB_METAWORKS_USER=${DB_METAWORKS_USER:-root}
      - DB_METAWORKS_PASSWORD=${DB_METAWORKS_PASSWORD:-}
      - DB_IGSN_HOST=${DB_IGSN_HOST:-127.0.0.1}
      - DB_IGSN_PORT=${DB_IGSN_PORT:-3306}
      - DB_IGSN_NAME=${DB_IGSN_NAME:-igsn-metadata}
      - DB_IGSN_USER=${DB_IGSN_USER:-root}
      - DB_IGSN_PASSWORD=${DB_IGSN_PASSWORD:-}
      - DB_IGSN_SSL_CA=${DB_IGSN_SSL_CA:-/etc/ssl/certs/ca-certificates.crt}
      - IGSN_LEGACY_DB_ENABLED=${IGSN_LEGACY_DB_ENABLED:-false}
      - GFZ_IGSN_PORTAL_PROXY_URL=${GFZ_IGSN_PORTAL_PROXY_URL:-https://dataservices.gfz-potsdam.de/igsn/portal/proxy/proxy.php}
      - GFZ_IGSN_PORTAL_CONNECT_TIMEOUT=${GFZ_IGSN_PORTAL_CONNECT_TIMEOUT:-5}
      - GFZ_IGSN_PORTAL_TIMEOUT=${GFZ_IGSN_PORTAL_TIMEOUT:-30}
      - GFZ_IGSN_PORTAL_RETRY_TIMES=${GFZ_IGSN_PORTAL_RETRY_TIMES:-3}
      - GFZ_IGSN_PORTAL_RETRY_SLEEP_MS=${GFZ_IGSN_PORTAL_RETRY_SLEEP_MS:-500}
      - GFZ_IGSN_PORTAL_RETRY_JITTER_MS=${GFZ_IGSN_PORTAL_RETRY_JITTER_MS:-100}
      - GFZ_IGSN_PORTAL_PAGE_SIZE=${GFZ_IGSN_PORTAL_PAGE_SIZE:-500}
      - GFZ_IGSN_PORTAL_CACHE_TTL=${GFZ_IGSN_PORTAL_CACHE_TTL:-600}
      - SOLR_HOST=${SOLR_HOST:-}
      - SOLR_PORT=${SOLR_PORT:-443}
      - SOLR_USER=${SOLR_USER:-}
      - SOLR_PASSWORD=${SOLR_PASSWORD:-}
      # Mail configuration
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@gfz-potsdam.de}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-ERNIE}

  webserver:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    pull_policy: build
    container_name: dockerized-laravel-webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage-data:/var/www/html/storage:ro
    networks:
      - dockerized-laravel-network
      - traefik
    depends_on:
      - app
    labels:
      - "traefik.enable=true"
      # Canonical ERNIE router. More specific legacy paths are handled by the
      # higher-priority router below.
      - "traefik.http.routers.ernie-router.rule=Host(`dataservices.gfz.de`)"
      - "traefik.http.routers.ernie-router.entrypoints=https"
      - "traefik.http.routers.ernie-router.service=ernie-service"
      # Redirect the exact root and confirmed first path segments to the retired
      # TYPO3 host. The (/|$) boundary is essential: /igsn must not capture
      # /igsns, and /thesaurus must not capture /thesauri.
      - "traefik.http.routers.dataservices-legacy-router.rule=Host(`dataservices.gfz.de`) && (Path(`/`) || PathRegexp(`^/(4dmb|arbodat|b2find|bfo|caos|contact|dekorp|dekorp-tryout|digis|dome|enmap|extern|generalinclude|geoxlabs|gipp|grace|gracefo|gravis|icdp|icgem|igets|igsn|igsn-new|igsnstats|igsntest|intermagnet|isg|lib|mesi|msl|msl-old|msl-tryout|muell|panmetaworks|panmetaworks-tryout|pik|portal|reassign|restricted|riesgos|SDDB|tereno|tereno-new|thesaurus|web|wsm)(/|$$)`))"
      - "traefik.http.routers.dataservices-legacy-router.entrypoints=https"
      - "traefik.http.routers.dataservices-legacy-router.service=ernie-service"
      - "traefik.http.routers.dataservices-legacy-router.middlewares=dataservices-legacy-redirect"
      - "traefik.http.routers.dataservices-legacy-router.priority=300"
      - "traefik.http.middlewares.dataservices-legacy-redirect.redirectregex.regex=^https://dataservices[.]gfz[.]de/(.*)"
      - "traefik.http.middlewares.dataservices-legacy-redirect.redirectregex.replacement=https://dataservices.gfz-potsdam.de/$${1}"
      - "traefik.http.middlewares.dataservices-legacy-redirect.redirectregex.permanent=false"
      # Preserve bookmarks for the ERNIE portal while /portal on the canonical
      # host remains owned by the retired website.
      - "traefik.http.routers.ernie-old-portal-router.rule=Host(`ernie.rz-vm499.gfz.de`) && PathRegexp(`^/portal(/|$$)`)"
      - "traefik.http.routers.ernie-old-portal-router.entrypoints=https"
      - "traefik.http.routers.ernie-old-portal-router.service=ernie-service"
      - "traefik.http.routers.ernie-old-portal-router.middlewares=ernie-old-portal-redirect"
      - "traefik.http.routers.ernie-old-portal-router.priority=300"
      - "traefik.http.middlewares.ernie-old-portal-redirect.redirectregex.regex=^https://ernie[.]rz-vm499[.]gfz[.]de/portal(.*)"
      - "traefik.http.middlewares.ernie-old-portal-redirect.redirectregex.replacement=https://dataservices.gfz.de/doi-search$${1}"
      - "traefik.http.middlewares.ernie-old-portal-redirect.redirectregex.permanent=true"
      # All remaining requests on the former ERNIE host retain their path and
      # query while moving to the canonical Data Services host.
      - "traefik.http.routers.ernie-old-router.rule=Host(`ernie.rz-vm499.gfz.de`)"
      - "traefik.http.routers.ernie-old-router.entrypoints=https"
      - "traefik.http.routers.ernie-old-router.service=ernie-service"
      - "traefik.http.routers.ernie-old-router.middlewares=ernie-old-redirect"
      - "traefik.http.routers.ernie-old-router.priority=200"
      - "traefik.http.middlewares.ernie-old-redirect.redirectregex.regex=^https://ernie[.]rz-vm499[.]gfz[.]de/(.*)"
      - "traefik.http.middlewares.ernie-old-redirect.redirectregex.replacement=https://dataservices.gfz.de/$${1}"
      - "traefik.http.middlewares.ernie-old-redirect.redirectregex.permanent=true"
      # Service
      - "traefik.http.services.ernie-service.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

  db:
    image: mysql:9.7.2@sha256:257388edf9c84dbc04c763625446d5f3fa6ed60d1b0873bc552c614ba0a7ab4e
    container_name: dockerized-laravel-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MARIADB_DATABASE}
      - MYSQL_USER=${MARIADB_USER}
      - MYSQL_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - dockerized-laravel-data:/var/lib/mysql
    networks:
      - dockerized-laravel-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    container_name: dockerized-laravel-redis
    restart: unless-stopped
    networks:
      - dockerized-laravel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  fuji:
    image: ghcr.io/pangaea-data-publisher/fuji@sha256:a75a9c88fb46918afafb09593aa52aecc1adb12eb9f19a2fc2ebb8740be03d97
    container_name: ernie-fuji-prod
    restart: unless-stopped
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        set -e
        mkdir -p "${TIKA_LOG_PATH:-/tmp/tika}"
        export TIKA_LOG_PATH="${TIKA_LOG_PATH:-/tmp/tika}"
        python3 -c 'import json,os; open("/usr/src/app/fuji_server/config/users.py","w").write("fuji_users = "+json.dumps({os.environ["FUJI_USERNAME"]:os.environ["FUJI_PASSWORD"]})+"\n")'
        exec python3 -m fuji_server -c /usr/src/app/fuji_server/config/server.ini
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - FUJI_USERNAME=${FUJI_USERNAME:-ernie}
      - FUJI_PASSWORD=${FUJI_PASSWORD}
      - TIKA_LOG_PATH=/tmp/tika
    networks:
      - dockerized-laravel-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1071/fuji/api/v1/ui/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    pull_policy: build
    container_name: dockerized-laravel-queue
    restart: unless-stopped
    command: php artisan queue:work --queue=${DATACITE_QUEUE:-datacite},vocabularies,database-dumps,default,imports --verbose --tries=3 --timeout=7200
    volumes:
      - storage-data:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
    networks:
      - dockerized-laravel-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-https://dataservices.gfz.de}
      # Keep this identical to the app service for observer/job consistency.
      - OAI_IDENTIFIER_PREFIX=${OAI_IDENTIFIER_PREFIX:-oai:ernie.rz-vm499.gfz.de}
      - APP_ENV=production
      - APP_DEBUG=false
      - INERTIA_SSR_ENABLED=false
      - DATACITE_ENDPOINT=${DATACITE_ENDPOINT:-https://api.datacite.org}
      - DATACITE_CLIENT_ID=${DATACITE_CLIENT_ID:-tib.gfz}
      - DATACITE_TEST_MODE=${DATACITE_TEST_MODE:-true}
      - DATACITE_USERNAME=${DATACITE_USERNAME}
      - DATACITE_PASSWORD=${DATACITE_PASSWORD}
      - DATACITE_IGSN_PREFIX=${DATACITE_IGSN_PREFIX:-10.60510}
      - DATACITE_IGSN_CLIENT_ID=${DATACITE_IGSN_CLIENT_ID:-gfz.igsn}
      - DATACITE_IGSN_USERNAME=${DATACITE_IGSN_USERNAME}
      - DATACITE_IGSN_PASSWORD=${DATACITE_IGSN_PASSWORD}
      - DATACITE_USER_AGENT_EMAIL=${DATACITE_USER_AGENT_EMAIL:-datapub@gfz.de}
      - DATACITE_QUEUE=${DATACITE_QUEUE:-datacite}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=database
      - FUJI_ENABLED=${FUJI_ENABLED:-false}
      - FUJI_BASE_URL=${FUJI_BASE_URL:-http://fuji:1071}
      - FUJI_USERNAME=${FUJI_USERNAME:-ernie}
      - FUJI_PASSWORD=${FUJI_PASSWORD}
      - FUJI_TIMEOUT=${FUJI_TIMEOUT:-120}
      - FUJI_CONNECT_TIMEOUT=${FUJI_CONNECT_TIMEOUT:-10}
      - FUJI_USE_DATACITE=${FUJI_USE_DATACITE:-true}
      - FUJI_USE_GITHUB=${FUJI_USE_GITHUB:-false}
      - FUJI_TEST_DEBUG=${FUJI_TEST_DEBUG:-false}
      - FUJI_METRIC_VERSION=${FUJI_METRIC_VERSION:-metrics_v0.8}
      - DB_SUMARIOPMD_HOST=${DB_SUMARIOPMD_HOST:-127.0.0.1}
      - DB_SUMARIOPMD_PORT=${DB_SUMARIOPMD_PORT:-3306}
      - DB_SUMARIOPMD_NAME=${DB_SUMARIOPMD_NAME:-sumario-pmd}
      - DB_SUMARIOPMD_USER=${DB_SUMARIOPMD_USER:-root}
      - DB_SUMARIOPMD_PASSWORD=${DB_SUMARIOPMD_PASSWORD:-}
      - DB_METAWORKS_HOST=${DB_METAWORKS_HOST:-127.0.0.1}
      - DB_METAWORKS_PORT=${DB_METAWORKS_PORT:-3306}
      - DB_METAWORKS_NAME=${DB_METAWORKS_NAME:-metaworks}
      - DB_METAWORKS_USER=${DB_METAWORKS_USER:-root}
      - DB_METAWORKS_PASSWORD=${DB_METAWORKS_PASSWORD:-}
      - DB_IGSN_HOST=${DB_IGSN_HOST:-127.0.0.1}
      - DB_IGSN_PORT=${DB_IGSN_PORT:-3306}
      - DB_IGSN_NAME=${DB_IGSN_NAME:-igsn-metadata}
      - DB_IGSN_USER=${DB_IGSN_USER:-root}
      - DB_IGSN_PASSWORD=${DB_IGSN_PASSWORD:-}
      - DB_IGSN_SSL_CA=${DB_IGSN_SSL_CA:-/etc/ssl/certs/ca-certificates.crt}
      - IGSN_LEGACY_DB_ENABLED=${IGSN_LEGACY_DB_ENABLED:-false}
      - GFZ_IGSN_PORTAL_PROXY_URL=${GFZ_IGSN_PORTAL_PROXY_URL:-https://dataservices.gfz-potsdam.de/igsn/portal/proxy/proxy.php}
      - GFZ_IGSN_PORTAL_CONNECT_TIMEOUT=${GFZ_IGSN_PORTAL_CONNECT_TIMEOUT:-5}
      - GFZ_IGSN_PORTAL_TIMEOUT=${GFZ_IGSN_PORTAL_TIMEOUT:-30}
      - GFZ_IGSN_PORTAL_RETRY_TIMES=${GFZ_IGSN_PORTAL_RETRY_TIMES:-3}
      - GFZ_IGSN_PORTAL_RETRY_SLEEP_MS=${GFZ_IGSN_PORTAL_RETRY_SLEEP_MS:-500}
      - GFZ_IGSN_PORTAL_RETRY_JITTER_MS=${GFZ_IGSN_PORTAL_RETRY_JITTER_MS:-100}
      - GFZ_IGSN_PORTAL_PAGE_SIZE=${GFZ_IGSN_PORTAL_PAGE_SIZE:-500}
      - GFZ_IGSN_PORTAL_CACHE_TTL=${GFZ_IGSN_PORTAL_CACHE_TTL:-600}
      - SOLR_HOST=${SOLR_HOST:-}
      - SOLR_PORT=${SOLR_PORT:-443}
      - SOLR_USER=${SOLR_USER:-}
      - SOLR_PASSWORD=${SOLR_PASSWORD:-}
      # Mail configuration (needed for queued mail jobs)
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@gfz-potsdam.de}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-ERNIE}

networks:
  dockerized-laravel-network:
    driver: bridge
  traefik:
    external: true

volumes:
  dockerized-laravel-data:
    driver: local
  storage-data:
    driver: local
  bootstrap-cache:
    driver: local
