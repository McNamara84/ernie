name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Setup npm
        run: npm install --global npm@12.0.2

      - name: Composer audit
        run: composer audit --locked

      - name: npm audit
        run: npm audit --package-lock-only --audit-level=low

  container-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build application image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: app
          load: true
          tags: ernie-security-scan:${{ github.sha }}
          cache-from: type=gha,scope=security-app
          cache-to: type=gha,mode=max,scope=security-app

      - name: Export application image
        run: docker save -o ernie-security-scan.tar ernie-security-scan:${{ github.sha }}

      - name: Resolve Trivy cache date
        id: trivy-cache-date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Trivy databases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .trivy-cache
          key: ${{ runner.os }}-trivy-${{ steps.trivy-cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Prepare Trivy cache
        run: mkdir -p .trivy-cache

      - name: Run Trivy vulnerability scanner
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
        run: |
          docker run --rm \
            -e TRIVY_DISABLE_VEX_NOTICE \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
            --input /work/ernie-security-scan.tar \
            --cache-dir /work/.trivy-cache \
            --scanners vuln \
            --format sarif \
            --output /work/trivy-results.sarif \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --skip-version-check

      - name: Upload Trivy scan results
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-results.sarif
          category: trivy-app-image

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore

      - name: Fail on high or critical image vulnerabilities
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
        run: |
          docker run --rm \
            -e TRIVY_DISABLE_VEX_NOTICE \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image \
            --input /work/ernie-security-scan.tar \
            --cache-dir /work/.trivy-cache \
            --scanners vuln \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --skip-version-check
