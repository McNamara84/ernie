name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Install Node dependencies
        run: npm ci

      - name: Composer audit
        run: composer audit

      - name: npm audit
        run: npm audit --audit-level=low

  container-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build application image
        run: docker build --target app -t ernie-security-scan:${{ github.sha }} .

      - name: Export application image
        run: docker save -o ernie-security-scan.tar ernie-security-scan:${{ github.sha }}

      - name: Prepare Trivy cache
        run: mkdir -p .trivy-cache

      - name: Run Trivy vulnerability scanner
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
        run: |
          docker run --rm \
            -e TRIVY_DISABLE_VEX_NOTICE \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image \
            --input /work/ernie-security-scan.tar \
            --cache-dir /work/.trivy-cache \
            --scanners vuln \
            --format sarif \
            --output /work/trivy-results.sarif \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --skip-version-check

      - name: Upload Trivy scan results
        if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) }}
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: trivy-results.sarif
          category: trivy-app-image

      - name: Upload Trivy SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore

      - name: Fail on high or critical image vulnerabilities
        env:
          TRIVY_DISABLE_VEX_NOTICE: 'true'
        run: |
          docker run --rm \
            -e TRIVY_DISABLE_VEX_NOTICE \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image \
            --input /work/ernie-security-scan.tar \
            --cache-dir /work/.trivy-cache \
            --scanners vuln \
            --format table \
            --exit-code 1 \
            --ignore-unfixed \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --skip-version-check
