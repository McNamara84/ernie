name: Publish Validated Images

on:
  workflow_run:
    workflows:
      - Security Checks
      - Pest PHP Unit Tests
      - MySQL Compatibility Tests
      - Vitest TS integration Tests
      - Linter Tests
      - Playwright UI Tests
    types:
      - completed
    branches:
      - main
      - dev
permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'dev') &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      branch: ${{ steps.source.outputs.branch }}
      app_image: ${{ steps.source.outputs.app_image }}
      checks_ready: ${{ steps.deployment-checks.outputs.ready }}
      current: ${{ steps.source.outputs.current }}
      nginx_image: ${{ steps.source.outputs.nginx_image }}
      fuji_image: ${{ steps.source.outputs.fuji_image }}
      sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout the candidate source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve source and image names
        id: source
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          SOURCE_SHA="$(git rev-parse HEAD)"
          OWNER="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"

          case "$SOURCE_BRANCH" in main|dev) ;; *) exit 1 ;; esac
          git fetch --no-tags origin "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          git merge-base --is-ancestor "$SOURCE_SHA" "refs/remotes/origin/${SOURCE_BRANCH}"
          CURRENT=true
          if [[ "$SOURCE_BRANCH" == dev && "$(git rev-parse refs/remotes/origin/dev)" != "$SOURCE_SHA" ]]; then
            CURRENT=false
            echo "Skipping stale dev commit $SOURCE_SHA."
          fi

          {
            echo "branch=$SOURCE_BRANCH"
            echo "current=$CURRENT"
            echo "sha=$SOURCE_SHA"
            echo "app_image=ghcr.io/${OWNER}/ernie-app"
            echo "nginx_image=ghcr.io/${OWNER}/ernie-nginx"
            echo "fuji_image=ghcr.io/${OWNER}/ernie-fuji"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful deployment checks
        if: steps.source.outputs.current == 'true'
        id: deployment-checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          SOURCE_BRANCH: ${{ steps.source.outputs.branch }}
        with:
          script: |
            const requiredWorkflows = [
              ['security.yml', 'Security Checks'],
              ['tests.yml', 'Pest PHP Unit Tests'],
              ['mysql.yml', 'MySQL Compatibility Tests'],
              ['vitest.yml', 'Vitest TS integration Tests'],
              ['lint.yml', 'Linter Tests'],
              ['playwright.yml', 'Playwright UI Tests'],
            ];
            const sourceSha = process.env.SOURCE_SHA;
            const results = [];

            for (const [workflowId, workflowName] of requiredWorkflows) {
              const response = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: workflowId,
                branch: process.env.SOURCE_BRANCH,
                event: 'push',
                head_sha: sourceSha,
                per_page: 10,
              });
              const run = response.data.workflow_runs
                .filter((candidate) =>
                  candidate.head_sha === sourceSha && candidate.event === 'push'
                )
                .sort((left, right) => right.id - left.id)[0];

              results.push({
                name: workflowName,
                status: run?.status ?? 'missing',
                conclusion: run?.conclusion ?? '-',
                url: run?.html_url ?? '',
              });
            }

            await core.summary
              .addHeading(`Deployment checks for ${sourceSha}`)
              .addTable([
                [
                  { data: 'Workflow', header: true },
                  { data: 'Status', header: true },
                  { data: 'Conclusion', header: true },
                ],
                ...results.map((result) => [
                  result.url ? `<a href="${result.url}">${result.name}</a>` : result.name,
                  result.status,
                  result.conclusion,
                ]),
              ])
              .write();

            const ready = results.every((result) =>
              result.status === 'completed' && result.conclusion === 'success'
            );
            core.setOutput('ready', ready ? 'true' : 'false');

            if (!ready) {
              const details = results
                .filter((result) =>
                  result.status !== 'completed' || result.conclusion !== 'success'
                )
                .map((result) => `${result.name}: ${result.status}/${result.conclusion}`)
                .join(', ');
              const message = `Image publication is blocked for ${sourceSha}: ${details}`;

              core.notice(message);
            }

  publish:
    needs: validate
    if: >-
      needs.validate.outputs.current == 'true' &&
      needs.validate.outputs.checks_ready == 'true'
    concurrency:
      # Only validated current dev pushes may replace an active publication.
      # Keep each main candidate independent, including older release candidates.
      group: publish-images-${{ needs.validate.outputs.branch }}-${{ needs.validate.outputs.branch == 'dev' && 'latest' || needs.validate.outputs.sha }}
      cancel-in-progress: ${{ needs.validate.outputs.branch == 'dev' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout the validated source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0

      - name: Validate public production environment
        run: bash scripts/validate-production-environment.sh

      - name: Resolve system package refresh date
        id: system-packages-refresh
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse immutable artifacts when available
        id: existing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          SOURCE_BRANCH: ${{ needs.validate.outputs.branch }}
        with:
          script: |
            const { readArtifact, artifactOutputs } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/deployment-artifacts.mjs`);
            artifactOutputs(core, await readArtifact(github, context.repo, process.env.SOURCE_BRANCH, process.env.SOURCE_SHA));

      - name: Build and push application image
        id: app-build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          push: true
          tags: ${{ needs.validate.outputs.app_image }}:sha-${{ needs.validate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=sha-${{ needs.validate.outputs.sha }}
          build-args: |
            SYSTEM_PACKAGES_REFRESH=${{ steps.system-packages-refresh.outputs.date }}
          cache-from: |
            type=gha,scope=security-app
            type=gha,scope=publish-${{ needs.validate.outputs.branch }}-app
          cache-to: type=gha,mode=max,scope=publish-${{ needs.validate.outputs.branch }}-app

      - name: Build and push Nginx image
        id: nginx-build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: nginx
          push: true
          tags: ${{ needs.validate.outputs.nginx_image }}:sha-${{ needs.validate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=sha-${{ needs.validate.outputs.sha }}
          build-args: |
            SYSTEM_PACKAGES_REFRESH=${{ steps.system-packages-refresh.outputs.date }}
          cache-from: |
            type=gha,scope=security-app
            type=gha,scope=publish-${{ needs.validate.outputs.branch }}-app
            type=gha,scope=publish-${{ needs.validate.outputs.branch }}-nginx
          cache-to: type=gha,mode=max,scope=publish-${{ needs.validate.outputs.branch }}-nginx

      - name: Build and push F-UJI image with Chromium
        id: fuji-build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.fuji
          push: true
          tags: ${{ needs.validate.outputs.fuji_image }}:sha-${{ needs.validate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=sha-${{ needs.validate.outputs.sha }}
          build-args: |
            SYSTEM_PACKAGES_REFRESH=${{ steps.system-packages-refresh.outputs.date }}
          cache-from: |
            type=gha,scope=security-fuji
            type=gha,scope=publish-${{ needs.validate.outputs.branch }}-fuji
          cache-to: type=gha,mode=max,scope=publish-${{ needs.validate.outputs.branch }}-fuji

      - name: Prepare Trivy cache
        run: mkdir -p "${{ runner.temp }}/trivy-cache"

      - name: Scan exact published image digests
        env:
          APP_IMAGE_REF: ${{ needs.validate.outputs.app_image }}@${{ steps.existing.outputs.app_digest || steps.app-build.outputs.digest }}
          NGINX_IMAGE_REF: ${{ needs.validate.outputs.nginx_image }}@${{ steps.existing.outputs.nginx_digest || steps.nginx-build.outputs.digest }}
          FUJI_IMAGE_REF: ${{ needs.validate.outputs.fuji_image }}@${{ steps.existing.outputs.fuji_digest || steps.fuji-build.outputs.digest }}
          TRIVY_DISABLE_VEX_NOTICE: 'true'
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_USERNAME: ${{ github.actor }}
        run: |
          set -uo pipefail
          scan_status=0

          for image_ref in "$APP_IMAGE_REF" "$NGINX_IMAGE_REF" "$FUJI_IMAGE_REF"; do
            if [[ ! "$image_ref" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid published image reference: $image_ref" >&2
              scan_status=1
              continue
            fi

            docker run --rm \
              -e TRIVY_DISABLE_VEX_NOTICE \
              -e TRIVY_PASSWORD \
              -e TRIVY_USERNAME \
              -v "${{ runner.temp }}/trivy-cache:/root/.cache/trivy" \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c image \
              --cache-dir /root/.cache/trivy \
              --scanners vuln \
              --format table \
              --exit-code 1 \
              --ignore-unfixed \
              --pkg-types os,library \
              --severity CRITICAL,HIGH \
              --skip-version-check \
              "$image_ref" || scan_status=1
          done

          exit "$scan_status"

      - name: Record immutable image artifacts
        id: artifacts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          SOURCE_BRANCH: ${{ needs.validate.outputs.branch }}
          APP_REF: ${{ needs.validate.outputs.app_image }}@${{ steps.existing.outputs.app_digest || steps.app-build.outputs.digest }}
          NGINX_REF: ${{ needs.validate.outputs.nginx_image }}@${{ steps.existing.outputs.nginx_digest || steps.nginx-build.outputs.digest }}
          FUJI_REF: ${{ needs.validate.outputs.fuji_image }}@${{ steps.existing.outputs.fuji_digest || steps.fuji-build.outputs.digest }}
        with:
          script: |
            const { readFileSync } = await import('node:fs');
            const { publishArtifact } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/deployment-artifacts.mjs`);
            const record = {
              schema: 1, repository: `${context.repo.owner}/${context.repo.repo}`,
              branch: process.env.SOURCE_BRANCH, sha: process.env.SOURCE_SHA,
              version: JSON.parse(readFileSync('resources/data/changelog.json', 'utf8'))[0].version,
              images: { app: process.env.APP_REF, nginx: process.env.NGINX_REF, fuji: process.env.FUJI_REF },
            };
            const commit = await publishArtifact(github, context.repo, record);
            core.setOutput('commit', commit);
            await core.summary.addHeading('Validated image artifacts')
              .addCodeBlock(JSON.stringify(record, null, 2), 'json')
              .addLink('Immutable artifact record', `https://github.com/${record.repository}/blob/${commit}/${record.sha}.json`).write();

      - name: Confirm that the candidate is still current
        if: needs.validate.outputs.branch == 'dev'
        id: latest
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "refs/heads/dev:refs/remotes/origin/dev"

          if [[ "$(git rev-parse refs/remotes/origin/dev)" == "$SOURCE_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Images remain available by SHA, but a newer dev commit will be promoted instead."
          fi

      - name: Create digest-pinned Stage deployment commit
        if: needs.validate.outputs.branch == 'dev' && steps.latest.outputs.current == 'true'
        id: deployment
        env:
          APP_DIGEST: ${{ steps.existing.outputs.app_digest || steps.app-build.outputs.digest }}
          APP_IMAGE: ${{ needs.validate.outputs.app_image }}
          NGINX_DIGEST: ${{ steps.existing.outputs.nginx_digest || steps.nginx-build.outputs.digest }}
          NGINX_IMAGE: ${{ needs.validate.outputs.nginx_image }}
          FUJI_DIGEST: ${{ steps.existing.outputs.fuji_digest || steps.fuji-build.outputs.digest }}
          FUJI_IMAGE: ${{ needs.validate.outputs.fuji_image }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ ! "$APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid application image digest: $APP_DIGEST" >&2
            exit 1
          fi

          if [[ ! "$NGINX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid Nginx image digest: $NGINX_DIGEST" >&2
            exit 1
          fi

          if [[ ! "$FUJI_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid F-UJI image digest: $FUJI_DIGEST" >&2
            exit 1
          fi

          APP_TEMPLATE="${APP_IMAGE}:deployment-template"
          NGINX_TEMPLATE="${NGINX_IMAGE}:deployment-template"
          FUJI_TEMPLATE="${FUJI_IMAGE}:deployment-template"
          APP_TEMPLATE_COUNT="$(grep -Fc "$APP_TEMPLATE" docker-compose.stage.yml)"
          NGINX_TEMPLATE_COUNT="$(grep -Fc "$NGINX_TEMPLATE" docker-compose.stage.yml)"
          FUJI_TEMPLATE_COUNT="$(grep -Fc "$FUJI_TEMPLATE" docker-compose.stage.yml)"

          if [[ "$APP_TEMPLATE_COUNT" -ne 4 || "$NGINX_TEMPLATE_COUNT" -ne 1 || "$FUJI_TEMPLATE_COUNT" -ne 1 ]]; then
            echo "Unexpected Stage image template count: app=$APP_TEMPLATE_COUNT nginx=$NGINX_TEMPLATE_COUNT fuji=$FUJI_TEMPLATE_COUNT" >&2
            exit 1
          fi

          sed -i "s|${APP_TEMPLATE}|${APP_IMAGE}@${APP_DIGEST}|g" docker-compose.stage.yml
          sed -i "s|${NGINX_TEMPLATE}|${NGINX_IMAGE}@${NGINX_DIGEST}|g" docker-compose.stage.yml
          sed -i "s|${FUJI_TEMPLATE}|${FUJI_IMAGE}@${FUJI_DIGEST}|g" docker-compose.stage.yml

          if grep -Fq "$APP_TEMPLATE" docker-compose.stage.yml || grep -Fq "$NGINX_TEMPLATE" docker-compose.stage.yml || grep -Fq "$FUJI_TEMPLATE" docker-compose.stage.yml; then
            echo "Stage image templates remain after digest pinning." >&2
            exit 1
          fi

          docker compose -f docker-compose.stage.yml config --quiet

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.stage.yml

          PREVIOUS_DEPLOY_SHA="$(git ls-remote --heads origin refs/heads/deploy/stage | awk '{print $1}')"
          PARENTS=(-p "$SOURCE_SHA")

          if [[ -n "$PREVIOUS_DEPLOY_SHA" ]]; then
            git fetch --no-tags origin \
              "+refs/heads/deploy/stage:refs/remotes/origin/deploy/stage"
            PARENTS=(-p "$PREVIOUS_DEPLOY_SHA")

            if [[ "$PREVIOUS_DEPLOY_SHA" != "$SOURCE_SHA" ]]; then
              PARENTS+=(-p "$SOURCE_SHA")
            fi
          fi

          DEPLOY_TREE="$(git write-tree)"
          DEPLOY_COMMIT="$(git commit-tree "$DEPLOY_TREE" "${PARENTS[@]}" -m "Deploy Stage from $SOURCE_SHA")"

          {
            echo "commit=$DEPLOY_COMMIT"
            echo "previous=$PREVIOUS_DEPLOY_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Advance the digest-pinned Stage deployment branch
        if: needs.validate.outputs.branch == 'dev' && steps.latest.outputs.current == 'true'
        env:
          DEPLOY_COMMIT: ${{ steps.deployment.outputs.commit }}
          PREVIOUS_DEPLOY_SHA: ${{ steps.deployment.outputs.previous }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "refs/heads/dev:refs/remotes/origin/dev"

          if [[ "$(git rev-parse refs/remotes/origin/dev)" != "$SOURCE_SHA" ]]; then
            echo "dev advanced while preparing the deployment commit; leaving deploy/stage unchanged."
            exit 0
          fi

          if [[ -n "$PREVIOUS_DEPLOY_SHA" ]]; then
            DEPLOY_LEASE="--force-with-lease=refs/heads/deploy/stage:${PREVIOUS_DEPLOY_SHA}"
          else
            DEPLOY_LEASE="--force-with-lease=refs/heads/deploy/stage:"
          fi

          git push "$DEPLOY_LEASE" origin "${DEPLOY_COMMIT}:refs/heads/deploy/stage"
