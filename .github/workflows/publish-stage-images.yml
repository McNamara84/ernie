name: Publish Stage Images

on:
  workflow_run:
    workflows:
      - Security Checks
      - Pest PHP Unit Tests
      - Vitest TS integration Tests
      - Linter Tests
      - Playwright UI Tests
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-stage-images
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      app_image: ${{ steps.source.outputs.app_image }}
      checks_ready: ${{ steps.deployment-checks.outputs.ready }}
      current: ${{ steps.source.outputs.current }}
      nginx_image: ${{ steps.source.outputs.nginx_image }}
      sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout the candidate main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'refs/heads/main' }}
          fetch-depth: 0

      - name: Resolve source and image names
        id: source
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          SOURCE_SHA="$(git rev-parse HEAD)"
          OWNER="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"

          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"

          if [[ "$(git rev-parse refs/remotes/origin/main)" == "$SOURCE_SHA" ]]; then
            CURRENT=true
          else
            CURRENT=false
            echo "Skipping stale commit $SOURCE_SHA because main has advanced."
          fi

          {
            echo "current=$CURRENT"
            echo "sha=$SOURCE_SHA"
            echo "app_image=ghcr.io/${OWNER}/ernie-app"
            echo "nginx_image=ghcr.io/${OWNER}/ernie-nginx"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful deployment checks
        if: steps.source.outputs.current == 'true'
        id: deployment-checks
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const requiredWorkflows = [
              ['security.yml', 'Security Checks'],
              ['tests.yml', 'Pest PHP Unit Tests'],
              ['vitest.yml', 'Vitest TS integration Tests'],
              ['lint.yml', 'Linter Tests'],
              ['playwright.yml', 'Playwright UI Tests'],
            ];
            const sourceSha = process.env.SOURCE_SHA;
            const results = [];

            for (const [workflowId, workflowName] of requiredWorkflows) {
              const response = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: workflowId,
                branch: 'main',
                event: 'push',
                head_sha: sourceSha,
                per_page: 10,
              });
              const run = response.data.workflow_runs
                .filter((candidate) =>
                  candidate.head_sha === sourceSha && candidate.event === 'push'
                )
                .sort((left, right) => right.id - left.id)[0];

              results.push({
                name: workflowName,
                status: run?.status ?? 'missing',
                conclusion: run?.conclusion ?? '-',
                url: run?.html_url ?? '',
              });
            }

            await core.summary
              .addHeading(`Deployment checks for ${sourceSha}`)
              .addTable([
                [
                  { data: 'Workflow', header: true },
                  { data: 'Status', header: true },
                  { data: 'Conclusion', header: true },
                ],
                ...results.map((result) => [
                  result.url ? `<a href="${result.url}">${result.name}</a>` : result.name,
                  result.status,
                  result.conclusion,
                ]),
              ])
              .write();

            const ready = results.every((result) =>
              result.status === 'completed' && result.conclusion === 'success'
            );
            core.setOutput('ready', ready ? 'true' : 'false');

            if (!ready) {
              const details = results
                .filter((result) =>
                  result.status !== 'completed' || result.conclusion !== 'success'
                )
                .map((result) => `${result.name}: ${result.status}/${result.conclusion}`)
                .join(', ');
              const message = `Stage publication is blocked for ${sourceSha}: ${details}`;

              if (context.eventName === 'workflow_dispatch') {
                core.setFailed(message);
              } else {
                core.notice(message);
              }
            }

  publish:
    needs: validate
    if: >-
      needs.validate.outputs.current == 'true' &&
      needs.validate.outputs.checks_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout the validated main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0

      - name: Replace production environment with public build defaults
        run: cp .env.example .env.production

      - name: Resolve system package refresh date
        id: system-packages-refresh
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable application image
        id: app-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: app
          push: true
          tags: ${{ needs.validate.outputs.app_image }}:sha-${{ needs.validate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=sha-${{ needs.validate.outputs.sha }}
          build-args: |
            SYSTEM_PACKAGES_REFRESH=${{ steps.system-packages-refresh.outputs.date }}
          cache-from: |
            type=gha,scope=security-app
            type=gha,scope=stage-app
          cache-to: type=gha,mode=max,scope=stage-app

      - name: Build and push immutable Nginx image
        id: nginx-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: nginx
          push: true
          tags: ${{ needs.validate.outputs.nginx_image }}:sha-${{ needs.validate.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
            org.opencontainers.image.version=sha-${{ needs.validate.outputs.sha }}
          build-args: |
            SYSTEM_PACKAGES_REFRESH=${{ steps.system-packages-refresh.outputs.date }}
          cache-from: |
            type=gha,scope=security-app
            type=gha,scope=stage-app
            type=gha,scope=stage-nginx
          cache-to: type=gha,mode=max,scope=stage-nginx

      - name: Confirm that the candidate is still current
        id: latest
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"

          if [[ "$(git rev-parse refs/remotes/origin/main)" == "$SOURCE_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Images remain available by SHA, but a newer main commit will be promoted instead."
          fi

      - name: Promote immutable images to the Stage channel
        if: steps.latest.outputs.current == 'true'
        env:
          APP_DIGEST: ${{ steps.app-build.outputs.digest }}
          APP_IMAGE: ${{ needs.validate.outputs.app_image }}
          NGINX_DIGEST: ${{ steps.nginx-build.outputs.digest }}
          NGINX_IMAGE: ${{ needs.validate.outputs.nginx_image }}
        run: |
          set -euo pipefail

          docker buildx imagetools create --tag "${APP_IMAGE}:stage" "${APP_IMAGE}@${APP_DIGEST}"

          docker buildx imagetools create --tag "${NGINX_IMAGE}:stage" "${NGINX_IMAGE}@${NGINX_DIGEST}"

      - name: Advance the Stage deployment branch
        if: steps.latest.outputs.current == 'true'
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/main"

          if [[ "$(git rev-parse refs/remotes/origin/main)" != "$SOURCE_SHA" ]]; then
            echo "main advanced after image promotion; leaving deploy/stage unchanged."
            exit 0
          fi

          git push origin "${SOURCE_SHA}:refs/heads/deploy/stage"
