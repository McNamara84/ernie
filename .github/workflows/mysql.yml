name: MySQL Compatibility Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  mysql:
    name: MySQL 9.7 sensitive tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: ernie-mysql-ci

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Setup npm
        run: npm install --global npm@12.2.0

      - name: Prepare isolated Docker environment
        run: |
          cp .env.docker.example .env.docker
          cp .env.docker.example .env

      - name: Build development application image
        run: docker compose --env-file .env.docker -f docker-compose.dev.yml build app

      - name: Run MySQL-sensitive tests
        run: npm run test:php:mysql-sensitive
        env:
          ERNIE_TEST_TIMINGS_FILE: ${{ runner.temp }}/ernie-mysql-timings.json

      - name: Upload MySQL timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mysql-timings
          path: ${{ runner.temp }}/ernie-mysql-timings.json
          if-no-files-found: warn
          retention-days: 7

      - name: Show backend logs on failure
        if: failure()
        run: docker compose --env-file .env.docker -f docker-compose.dev.yml --profile test logs --no-color app db db-test

      - name: Stop backend services
        if: always()
        run: docker compose --env-file .env.docker -f docker-compose.dev.yml --profile test down --volumes --remove-orphans
