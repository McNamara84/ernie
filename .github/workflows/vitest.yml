name: Vitest TS integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  vitest-shard:
    name: Vitest shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Generate Wayfinder Routes
        run: php artisan wayfinder:generate

      - name: TypeScript Check
        if: matrix.shard == 1
        run: npm run types

      - name: Run Vitest shard with coverage
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1
          VITE_APP_URL: ''
          APP_URL: ''
        run: npm run test:coverage -- --reporter=blob --coverage.reporter=json-summary --shard=${{ matrix.shard }}/3

      - name: Upload Vitest shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-results-${{ matrix.shard }}
          path: .vitest-reports
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  vitest:
    name: Vitest
    if: ${{ !cancelled() }}
    needs: vitest-shard
    runs-on: ubuntu-latest

    steps:
      - name: Verify Vitest shards
        if: ${{ needs.vitest-shard.result != 'success' }}
        run: exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Download Vitest shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .vitest-reports
          merge-multiple: true

      - name: Merge Vitest and coverage reports
        run: npx vitest --config vitest.merge.config.ts --merge-reports --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
