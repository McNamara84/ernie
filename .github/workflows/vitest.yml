name: Vitest TS integration Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  vitest-shard:
    name: Vitest shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Generate Wayfinder Routes
        run: php artisan wayfinder:generate

      - name: TypeScript Check
        if: matrix.shard == 1
        run: npm run types

      - name: Test validation tooling
        if: matrix.shard == 1
        run: npm run test:tooling

      - name: Run Vitest shard with coverage
        env:
          LARAVEL_BYPASS_ENV_CHECK: 1
          VITE_APP_URL: ''
          APP_URL: ''
        run: npm run test:coverage -- --reporter=blob --coverage.reporter=json-summary --shard=${{ matrix.shard }}/3

      - name: Upload Vitest shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-results-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  vitest:
    name: Vitest
    if: ${{ !cancelled() }}
    needs: vitest-shard
    runs-on: ubuntu-latest

    steps:
      - name: Verify Vitest shards
        if: ${{ needs.vitest-shard.result != 'success' }}
        run: exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Download Vitest shard results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-results-*
          path: .vitest/blob
          merge-multiple: true

      - name: Verify complete Vitest shard artifacts
        run: |
          node --input-type=module - <<'JS'
          import { readdirSync } from 'node:fs';
          import assert from 'node:assert/strict';
          assert.deepEqual(readdirSync('.vitest/blob').sort(), ['blob-1-3.json', 'blob-2-3.json', 'blob-3-3.json']);
          JS

      - name: Merge Vitest and coverage reports
        run: npx vitest --config vitest.merge.config.ts --merge-reports --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          disable_search: true

      - name: Enforce complete aggregate coverage baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COVERAGE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.number }}
          FRONTEND_SUITE_RESULT: ${{ needs.vitest-shard.result }}
        run: node scripts/check-ci-project-coverage.mjs
