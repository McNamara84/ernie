name: Pest PHP Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Pest PHP Tests

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5
          ini-values: memory_limit=1G
          tools: composer:v2
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Assets
        run: npm run build
        env:
          NODE_ENV: production
          APP_ENV: testing
          APP_URL: http://localhost
          ASSET_URL: http://localhost

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Configure test environment
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i '/^DB_HOST=/d' .env
          sed -i '/^DB_PORT=/d' .env  
          sed -i '/^DB_DATABASE=/d' .env
          sed -i '/^DB_USERNAME=/d' .env
          sed -i '/^DB_PASSWORD=/d' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=file/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=log/' .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's/^APP_URL=.*/APP_URL=http:\/\/localhost/' .env
          sed -i 's/^ASSET_URL=.*/ASSET_URL=http:\/\/localhost/' .env
          mkdir -p database
          touch database/database.sqlite
          chmod 666 database/database.sqlite
          echo "=== .env configuration for tests ==="
          cat .env | grep -E "(APP_|DB_|SESSION_|CACHE_|QUEUE_|ASSET_|BROADCAST_)"
          echo "============================="

      - name: Setup database
        run: |
          php artisan config:clear
          php artisan cache:clear
          php artisan migrate:fresh --seed --force

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Debug Vite manifest
        run: |
          echo "=== Vite build output ==="
          ls -la public/build/ || echo "No build directory found"
          echo "=== Vite manifest content ==="
          cat public/build/manifest.json | head -30 || echo "No manifest found"
          echo "=== Total entries in manifest ==="
          grep -c '"file"' public/build/manifest.json || echo "Could not count entries"

      - name: Debug routing
        run: |
          echo "=== Available routes ==="
          php artisan route:list | head -20 || echo "Could not list routes"
          echo "=== Application configuration ==="
          php artisan config:show app.url || echo "Could not show app.url"

      - name: Tests
        env:
          XDEBUG_MODE: coverage
        run: |
          # Run serial tests first (tests that modify shared resources like log files)
          ./vendor/bin/pest --group=serial --exclude-testsuite=Arch --coverage-clover=coverage-serial.xml
          # Architecture tests parse the complete application and do not produce meaningful runtime coverage.
          # Keep them out of persistent ParaTest workers to avoid exhausting their 1 GiB memory limit.
          XDEBUG_MODE=off ./vendor/bin/pest --testsuite=Arch --no-coverage
          # Run remaining tests in parallel (excluding serial and architecture tests).
          # The parent process needs extra headroom when merging per-worker coverage;
          # explicitly pass the 1 GiB limit to ParaTest workers as parent CLI
          # options are not inherited by their child PHP processes.
          php -d memory_limit=4G ./vendor/bin/pest --parallel --passthru-php="'-d' 'memory_limit=1G'" --exclude-group=serial --exclude-testsuite=Arch --coverage-clover=coverage-parallel.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-serial.xml,coverage-parallel.xml
          flags: backend
          fail_ci_if_error: false
