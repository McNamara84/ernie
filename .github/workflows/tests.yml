name: Pest PHP Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest
    name: Pest ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: serial
            label: serial tests
            coverage: pcov
          - slice: architecture
            label: architecture tests
            coverage: none
          - slice: parallel
            label: parallel tests
            coverage: pcov

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5
          ini-values: memory_limit=1G, pcov.directory=.
          tools: composer:v2
          coverage: ${{ matrix.coverage }}

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Setup Node
        if: ${{ matrix.slice != 'architecture' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Setup npm
        if: ${{ matrix.slice != 'architecture' }}
        run: npm install --global npm@12.0.2

      - name: Install Node dependencies
        if: ${{ matrix.slice != 'architecture' }}
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build assets
        if: ${{ matrix.slice != 'architecture' }}
        run: npm run build
        env:
          NODE_ENV: production
          APP_ENV: testing
          APP_URL: http://localhost
          ASSET_URL: http://localhost

      - name: Copy environment file
        run: cp .env.example .env

      - name: Configure test environment
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i '/^DB_HOST=/d' .env
          sed -i '/^DB_PORT=/d' .env
          sed -i '/^DB_DATABASE=/d' .env
          sed -i '/^DB_USERNAME=/d' .env
          sed -i '/^DB_PASSWORD=/d' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=file/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=log/' .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's/^APP_URL=.*/APP_URL=http:\/\/localhost/' .env
          sed -i 's/^ASSET_URL=.*/ASSET_URL=http:\/\/localhost/' .env
          mkdir -p database
          touch database/database.sqlite
          chmod 666 database/database.sqlite

      - name: Generate application key
        run: php artisan key:generate

      - name: Verify migrations and seeders
        if: ${{ matrix.slice == 'serial' }}
        run: |
          php artisan config:clear
          php artisan cache:clear
          php artisan migrate:fresh --seed --force

      - name: Run serial tests with coverage
        if: ${{ matrix.slice == 'serial' }}
        run: ./vendor/bin/pest --group=serial --exclude-testsuite=Arch --coverage-clover=coverage-serial.xml

      - name: Run architecture tests
        if: ${{ matrix.slice == 'architecture' }}
        run: php -d memory_limit=2G ./vendor/bin/pest --testsuite=Arch --no-coverage

      - name: Run parallel tests with coverage
        if: ${{ matrix.slice == 'parallel' }}
        run: php -d memory_limit=4G ./vendor/bin/pest --parallel --passthru-php="'-d' 'memory_limit=1G'" --exclude-group=serial --exclude-testsuite=Arch --coverage-clover=coverage-parallel.xml

      - name: Upload coverage result
        if: ${{ matrix.slice != 'architecture' && success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pest-coverage-${{ matrix.slice }}
          path: coverage-${{ matrix.slice }}.xml
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Pest PHP Tests
    if: ${{ !cancelled() }}
    needs: pest
    runs-on: ubuntu-latest

    steps:
      - name: Verify Pest slices
        if: ${{ needs.pest.result != 'success' }}
        run: exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pest-coverage-*
          merge-multiple: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-serial.xml,coverage-parallel.xml
          flags: backend
          fail_ci_if_error: false
