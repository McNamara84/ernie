name: Pest PHP Unit Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest
    name: Pest ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: serial
            label: serial tests
            coverage: pcov
          - slice: architecture
            label: architecture tests
            coverage: none
            shard: ''
          - slice: parallel-1
            label: parallel tests (shard 1/2)
            coverage: pcov
            shard: 1/2
          - slice: parallel-2
            label: parallel tests (shard 2/2)
            coverage: pcov
            shard: 2/2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.5
          ini-values: memory_limit=1G, pcov.directory=., pcov.exclude="~/(?:vendor|tests)/~"
          tools: composer:v2
          coverage: ${{ matrix.coverage }}

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Non-browser tests disable Vite. Manifest-specific tests create their
      # own complete fixtures, so these PHP slices need no frontend build.

      - name: Copy environment file
        run: cp .env.example .env

      - name: Configure test environment
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i '/^DB_HOST=/d' .env
          sed -i '/^DB_PORT=/d' .env
          sed -i '/^DB_DATABASE=/d' .env
          sed -i '/^DB_USERNAME=/d' .env
          sed -i '/^DB_PASSWORD=/d' .env
          sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
          sed -i 's/^CACHE_DRIVER=.*/CACHE_DRIVER=file/' .env
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
          sed -i 's/^BROADCAST_CONNECTION=.*/BROADCAST_CONNECTION=log/' .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's/^APP_URL=.*/APP_URL=http:\/\/localhost/' .env
          sed -i 's/^ASSET_URL=.*/ASSET_URL=http:\/\/localhost/' .env
          mkdir -p database
          touch database/database.sqlite
          chmod 666 database/database.sqlite

      - name: Generate application key
        run: php artisan key:generate

      - name: Setup Node for JSON-LD validation
        if: ${{ matrix.slice == 'serial' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install JSON-LD validation dependencies
        if: ${{ matrix.slice == 'serial' }}
        run: |
          npm install --global npm@12.2.0
          npm ci

      - name: Validate actual DataCite and Schema.org JSON-LD exports offline
        if: ${{ matrix.slice == 'serial' }}
        run: npm run test:jsonld

      - name: Verify migrations and seeders
        if: ${{ matrix.slice == 'serial' }}
        run: |
          php artisan config:clear
          php artisan cache:clear
          php artisan migrate:fresh --seed --force

      - name: Run serial tests with coverage
        if: ${{ matrix.slice == 'serial' }}
        run: ./vendor/bin/pest --group=serial --exclude-testsuite=Arch --coverage-clover=coverage-serial.xml

      - name: Run architecture tests
        if: ${{ matrix.slice == 'architecture' }}
        run: php -d memory_limit=2G ./vendor/bin/pest --testsuite=Arch --no-coverage

      - name: Run parallel test shard with coverage
        if: ${{ startsWith(matrix.slice, 'parallel-') }}
        run: php -d memory_limit=4G ./vendor/bin/pest --parallel --shard=${{ matrix.shard }} --exclude-group=serial --exclude-testsuite=Arch --coverage-clover=coverage-${{ matrix.slice }}.xml

      - name: Upload coverage result
        if: ${{ matrix.slice != 'architecture' && success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pest-coverage-${{ matrix.slice }}
          path: coverage-${{ matrix.slice }}.xml
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Pest PHP Tests
    if: ${{ !cancelled() }}
    needs: pest
    runs-on: ubuntu-latest

    steps:
      - name: Verify Pest slices
        if: ${{ needs.pest.result != 'success' }}
        run: exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pest-coverage-*
          merge-multiple: true

      - name: Verify complete coverage artifacts
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for name in ('serial', 'parallel-1', 'parallel-2'):
              root = ET.parse(f'coverage-{name}.xml').getroot()
              assert root.tag == 'coverage' and root.findall('.//file'), f'Missing coverage in {name}'
          PY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-serial.xml,coverage-parallel-1.xml,coverage-parallel-2.xml
          flags: backend
          fail_ci_if_error: true
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          disable_search: true
