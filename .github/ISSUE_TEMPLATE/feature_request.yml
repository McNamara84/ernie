name: Feature Request
description: Suggest a new feature or improvement for ERNIE
type: Feature
labels: ["DoR not met"]
projects: ["McNamara84/14"]
body:
  - type: markdown
    attributes:
      value: |
        Use the page names shown in ERNIE. When relevant, link the affected Resource or identify the physical sample by its IGSN.

  # The workflow reads these two dropdowns before any free-text answers.
  - type: dropdown
    id: affected-areas
    attributes:
      label: Affected areas
      description: Select all areas that apply. Your selections become issue labels. Leave blank if unsure.
      multiple: true
      options:
        - Data Editor
        - Resources List
        - IGSN Curation & Registration
        - DOI Search Portal
        - IGSN Search Portal
        - IGSN Landing Pages
        - Resource Landing Pages
        - Metadata Import
        - Metadata Export
        - APIs & Integrations
        - OAI-PMH
        - Controlled Vocabularies
        - Assistant
        - Documentation

  - type: dropdown
    id: stakeholder
    attributes:
      label: Stakeholder
      description: Select the stakeholder who requested the feature, if known. Your choice appears in the issue text.
      multiple: false
      options:
        - All DataCurators
        - Repository Manager
        - IT Services
        - Data Protection Officer
        - DataHub
        - EPOS MSL
        - SysAdmin
        - Head of Section
        - Data Curator K
        - Data Curator A
        - Data Curator M
        - FAIR AIMS

  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: Describe the feature from a user's perspective.
      placeholder: |
        As a **...**, I want **...**, so that **...**.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: Define the conditions that must be met for this feature to be considered complete.
      placeholder: |
        - [ ] Given samples of different materials, when I filter by one material, then only matching samples appear.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe how you envision this feature working (optional).
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches? (optional)
    validations:
      required: false

  - type: checkboxes
    id: definition-of-ready
    attributes:
      label: Definition of Ready
      description: Check every item that is already true for this feature request.
      options:
        - label: The user role or target user (not Product Owner, not Scrum Master) is named at least in the user story.
        - label: The user story follows the INVEST criteria (Independent, Negotiable, Valuable, Estimable, Small, Testable).
        - label: The affected ERNIE page, route, workflow, or data type is named.
        - label: The problem or user need is clear.
        - label: The acceptance criteria follow the Given-When-Then format.
        - label: Acceptance criteria are testable.
        - label: Relevant Resource or Sample is included/linked when relevant.
        - label: Sketches, mockups, or wireframes are attached when they could be helpful.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any mockups, references, or further information.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Ready for work?** This issue is created with the `DoR not met` label by default. Remove it only when the Definition of Ready is met.
