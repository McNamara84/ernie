name: Bug Report
description: Report a bug or unexpected behavior in ERNIE
type: Bug
labels: ["DoR not met"]
projects: ["McNamara84/14"]
body:
  - type: markdown
    attributes:
      value: |
        Use the page names shown in ERNIE. When relevant, link the affected Resource or identify the physical sample by its IGSN.

  # The workflow reads these two dropdowns before any free-text answers.
  - type: dropdown
    id: affected-areas
    attributes:
      label: Affected areas
      description: Select all areas that apply. Your selections become issue labels. Leave blank if unsure.
      multiple: true
      options:
        - Data Editor
        - Resources List
        - IGSN Curation & Registration
        - DOI Search Portal
        - IGSN Search Portal
        - IGSN Landing Pages
        - Resource Landing Pages
        - Metadata Import
        - Metadata Export
        - APIs & Integrations
        - OAI-PMH
        - Controlled Vocabularies
        - Assistant
        - Documentation

  - type: dropdown
    id: stakeholder
    attributes:
      label: Stakeholder
      description: Select the stakeholder who reported the bug, if known. Your choice appears in the issue text.
      multiple: false
      options:
        - All DataCurators
        - Repository Manager
        - IT Services
        - Data Protection Officer
        - DataHub
        - EPOS MSL
        - SysAdmin
        - Head of Section
        - Data Curator K
        - Data Curator A
        - Data Curator M
        - FAIR AIMS

  - type: textarea
    id: description
    attributes:
      label: Actual Behavior
      description: What happened, and on which page, route, or workflow? Include your user role if relevant.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Open the IGSN Portal at /igsn-search.
        2. Choose a sample type.
        3. Open the second page of results.
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Error(s)
      description: Paste any error messages, console output, or unexpected behavior here.
      render: shell
    validations:
      required: false

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: screenshots-logs
    attributes:
      label: Screenshots / Logs
      description: If applicable, add screenshots or log files to help explain the problem.
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Which browser and version are you using?
    validations:
      required: false

  - type: input
    id: ernie-version
    attributes:
      label: ERNIE Version / Environment
      description: Where did you see the bug (production, staging, or local)? Include the version or branch if known.
    validations:
      required: false

  - type: checkboxes
    id: definition-of-ready
    attributes:
      label: Definition of Ready
      description: Check every item that is already true for this bug report.
      options:
        - label: The affected ERNIE page, route, or workflow is named.
        - label: If the bug is reported from stakeholders, the bug was reproduced by at least one team member.
        - label: The affected Resource or Sample is named/linked when relevant.
        - label: The user role, browser, ERNIE version or branch, and environment are added when relevant.
        - label: The current behavior and expected behavior are clear.
        - label: The steps to reproduce are testable.
        - label: Screenshots, logs, or error messages are attached when they could be helpful.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context about the problem.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Ready for work?** This issue is created with the `DoR not met` label by default. Remove it only when the Definition of Ready is met.
